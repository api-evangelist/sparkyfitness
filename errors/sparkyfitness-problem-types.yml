format: proprietary
rfc9457: false
content_type: application/json
envelope:
  shape: '{"error": "<human-readable message>"}'
  fields:
    - name: error
      type: string
      description: >-
        A single human-readable sentence. There is no machine-readable code,
        no type URI, no field pointer and no correlation id anywhere in the
        error envelope.
  note: >-
    Not RFC 9457. Nothing in the contract emits application/problem+json, and
    no operation declares a typed error schema — every 4xx/5xx response in the
    spec is documented with a prose description only. An agent cannot branch on
    an error programmatically; it has to string-match the message or branch on
    the status code alone.
batch_envelope:
  applies_to: POST /health-data
  shape: '{"message": string, "processed": [...], "errors": [...], "skipped": [...]}'
  description: >-
    The bulk health-data ingest is the one endpoint with a structured error
    surface, and it is a PARTIAL-SUCCESS envelope rather than an error type. A
    well-formed body returns 200 even when individual records fail; errors[]
    carries {error, entry} per rejected record and skipped[] carries records
    intentionally not written (e.g. Nutrition records with no source_id, which
    cannot be deduplicated). Both arrays are always present and may be empty.
  agent_rule: >-
    A 200 from POST /health-data does NOT mean everything was saved. Always read
    errors[] and skipped[]. Keying on the HTTP status alone will silently drop
    records.
status_codes:
  - status: 400
    occurrences: 170
    title: Bad Request
    meaning: Invalid input, missing required field, or a malformed body.
    examples:
      - '{"error": "Invalid JSON array format."}'
      - '{"error": "Invalid health data format. All entries must be non-null objects."}'
      - '{"error": "Entry date is required."}'
    remediation: Fix the request body or parameters; do not retry unchanged.
  - status: 401
    occurrences: 98
    title: Unauthorized
    meaning: Authentication credentials missing or invalid.
    examples:
      - '{"error": "Unauthorized: Missing API Key"}'
      - '{"error": "Unauthorized: Invalid or inactive API Key"}'
    remediation: >-
      Supply a valid API key (Authorization Bearer or x-api-key). "Inactive"
      and "invalid" are not distinguished in the message, so a revoked key looks
      like a wrong one.
  - status: 403
    occurrences: 142
    title: Forbidden
    meaning: >-
      Authenticated but not permitted — either the API key lacks the required
      permission, or Row Level Security scopes the row to a different user.
    examples:
      - '{"error": "Forbidden: API Key does not have health_data_write permission"}'
    remediation: Grant the permission on the key in Settings -> Developer & Integrations.
  - status: 404
    occurrences: 117
    title: Not Found
    meaning: >-
      Resource absent OR present but owned by another user — RLS makes these
      indistinguishable to the caller, which is deliberate.
    remediation: Do not retry; verify the id and the owning user.
  - status: 409
    occurrences: 8
    title: Conflict
    meaning: Uniqueness violation.
    examples:
