mcp_errors:
  - code: -32602
    meaning: Invalid params — the MCP JSON-RPC error for a tool call that fails input validation.
    note: >-
      The server pre-normalises null arguments to undefined before validation
      (stripNulls in mcpRoutes.ts) specifically because LLM clients send
      "start_date": null for omitted optional fields, which would otherwise fail
      Zod .optional() and produce a -32602.
