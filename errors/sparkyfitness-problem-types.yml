  - status: 422
    occurrences: 1
    title: Unprocessable Entity
    meaning: >-
      AI response unusable — refused, truncated, empty, invalid JSON, or an
      unsupported provider. Only on the AI/chat surface.
    remediation: Retry with a different prompt or switch the configured AI provider.
  - status: 429
    occurrences: 0
    title: Too Many Requests
    meaning: Rate limit exceeded.
    examples:
      - '{"error": "Rate limit exceeded."}'
    remediation: Honour Retry-After (per-key limiter) or back off (nginx auth limiter).
    note: >-
      NOT declared on a single operation in the contract, yet both documented
