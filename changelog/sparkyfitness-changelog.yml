breaking_changes_documented:
  - change: >-
      POST /health-data no longer returns 400 when SOME records in a batch fail.
      It returns 200 with a non-empty errors[] array; the remaining records are
      still saved. Automations that keyed on the 400 to detect partial failure
      must inspect errors[] instead.
    since: v0.18+ (as stated in the API reference)
    source: https://codewithcj.github.io/SparkyFitness/developer/api-reference
    note: >-
      The version string in the docs ("v0.18+") does not match any published tag
      — releases went v0.17.3 -> v1.6.0. The behaviour change is real and
      documented; the version it landed in is ambiguous from the public record.
