probe:
  attempted: false
  reason: 'tools/list was not POSTed: SparkyFitness operates no public instance, and the only reachable
    first-party host is the GitHub Pages docs site, which has no /mcp. Probing a stranger''s deployment
    would be probing a third party''s private server, not the provider''s. Tool names, descriptions and
    input-schema symbols are read from the project''s own registry source instead.'
  input_schemas: Recorded as Zod schema SYMBOLS, not expanded JSON Schema. The concrete inputSchema per
    tool requires authenticated introspection against a running instance.
