method: searched
source: https://codewithcj.github.io/SparkyFitness/features/mcp-server
name: sparkyfitness-mcp-server
status: published
summary: SparkyFitness ships a first-party Model Context Protocol server IN-PROCESS inside the main API
  server — there is no separate MCP service to run. It is a stateless StreamableHTTP transport mounted
  at POST /mcp on the operator's own deployment, built on @modelcontextprotocol/sdk, and it exposes the
  same tool registry the built-in AI assistant uses. Because SparkyFitness is self-hosted, the endpoint
  host is the operator's, not a vendor's.
deployment:
  mode: remote
  endpoint: https://{your-host}/mcp
  install: null
  package: null
  auth: api-key
  verified: searched
  note: 'An https URL an MCP client POSTs to, so mode is remote — but it is remote on the OPERATOR''S
    host: every SparkyFitness deployment serves its own /mcp. The project runs no public instance, so
    the endpoint could not be probed and no concrete URL is asserted. The docs also describe driving it
    from stdio-only clients through mcp-remote, but mcp-remote is a third-party bridge the project does
    not publish, so this is NOT recorded as local-stdio or both.'
transport: streamable-http (stateless; a fresh McpServer + transport per request)
protocol:
  sdk: '@modelcontextprotocol/sdk'
  note: mcpRoutes.ts clamps an MCP-Protocol-Version header that post-dates the bundled SDK down to LATEST_PROTOCOL_VERSION
    rather than 400ing the request — an explicit workaround for clients (the Claude.ai connector is named)
    that send their own newest version instead of the negotiated one.
authentication:
  scheme: Bearer token in the Authorization header
  credential: A SparkyFitness API key generated in Settings -> Developer & Integrations -> API Key Management
  docs: https://codewithcj.github.io/SparkyFitness/features/mcp-server
authorization:
  model: PostgreSQL Row Level Security, scoped to the user the API key authenticates
  note: MCP is scoped to authenticatedUserId (the logged-in actor), deliberately NOT to the delegation
    cookie, so a family-sharing delegation cannot silently make MCP act as another user.
  admin_dev_tools: Five developer/debugging tools run on the owner pool and BYPASS Row Level Security.
    They are off unless DEV_TOOLS_ENABLED=true AND the caller is an admin, and they are gated at registration
    so they never appear in a non-admin tools/list.
tool_profiles:
  full: Every chat-visible tool (the default).
  core: food, exercise, checkin, goals only — for small local models with no prompt cache.
  note: The user-selected profile is honored verbatim over MCP, unlike the in-app chat path.
tool_count: 56
