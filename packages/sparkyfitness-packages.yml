note: >-
  SparkyFitness publishes no client SDK on any language registry. npm
  (sparkyfitness, sparky-fitness, @sparkyfitness/sdk) and PyPI (sparkyfitness)
  all return 404, and the docs point integrators at the raw REST API and the MCP
  server rather than at a library. What it does distribute is the SELF-HOSTED
  APPLICATION itself: three first-party Docker images on Docker Hub (with a
  fourth non-root frontend variant referenced by the Helm chart) and a Helm
  chart in-repo. These are deployment artifacts, not client libraries, so no
  `SDKs` pointer is emitted for them — the ergonomics SDK checks would be
  credited for something the project does not ship.
