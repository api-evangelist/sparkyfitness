openapi: 3.2.0
info:
  title: SparkyFitness Wellness & Metrics API
  version: 1.0.0
  description: API documentation for the SparkyFitness application, providing a comprehensive guide to all available endpoints.
  contact:
    name: SparkyFitness Support
servers:
- url: https://{host}/api
  description: Self-hosted SparkyFitness instance (the operator supplies the host). The upstream spec declares the relative base "/api".
  variables:
    host:
      default: sparkyfitness.example.com
      description: Hostname of your own SparkyFitness deployment. SparkyFitness is self-hosted; there is no vendor-operated API host.
security:
- apiKeyAuth: []
tags:
- name: Wellness & Metrics
  description: Health metrics tracking (weight, measurements, sleep, mood) and fasting.
paths:
  /measurements/check-in-photos/dates:
    get:
      summary: List the dates on which the user has progress photos
      description: Returns the distinct calendar days (YYYY-MM-DD, newest first) that have at least one progress photo. Used to mark those days on the check-in calendar. Registered before /:date so it is not shadowed by it.
      tags:
      - Wellness & Metrics
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: Array of YYYY-MM-DD date strings.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: date
      operationId: getMeasurementsCheckInPhotosDates
      x-operation-id-source: derived
  /measurements/check-in-photos/{date}:
    get:
      summary: Get progress photos for a check-in date
      tags:
      - Wellness & Metrics
      security:
      - apiKeyAuth: []
      parameters:
      - in: path
        name: date
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Array of photo records for the given date.
        '400':
          description: Invalid date format.
      operationId: getMeasurementsCheckInPhotosByDate
      x-operation-id-source: derived
  /measurements/check-in-photos/file/{id}:
    get:
      summary: Serve a progress photo image (authenticated, owner/family only)
      tags:
      - Wellness & Metrics
      security:
      - apiKeyAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The image file.
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          description: Photo not found or not accessible.
      operationId: getMeasurementsCheckInPhotosFileById
      x-operation-id-source: derived
  /measurements/check-in-photos/{date}/{type}:
    post:
      summary: Upload a progress photo (front, back, or side)
      tags:
      - Wellness & Metrics
      security:
      - apiKeyAuth: []
      parameters:
      - in: path
        name: date
        required: true
        schema:
          type: string
          format: date
      - in: path
        name: type
        required: true
        schema:
          type: string
          enum:
          - front
          - back
          - side
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Photo uploaded successfully.
        '400':
          description: Invalid parameters or file type.
      operationId: postMeasurementsCheckInPhotosByDateByType
      x-operation-id-source: derived
  /measurements/check-in-photos/photo/{id}:
    delete:
      summary: Delete a progress photo by ID
      tags:
      - Wellness & Metrics
      security:
      - apiKeyAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Photo deleted.
        '400':
          description: Invalid ID.
      operationId: deleteMeasurementsCheckInPhotosPhotoById
      x-operation-id-source: derived
  /fasting/current:
    get:
      summary: Get current active fast
      tags:
      - Wellness & Metrics
      description: Retrieves the currently active fast for the authenticated user.
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: The active fast or null if none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FastingLog'
        '401':
          description: Unauthorized.
        '500':
          description: Internal server error.
      operationId: getFastingCurrent
      x-operation-id-source: derived
  /fasting/start:
    post:
      summary: Start a new fast
      tags:
      - Wellness & Metrics
      description: Starts a new fasting period for the authenticated user.
      security:
      - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - start_time
              - fasting_type
              properties:
                start_time:
                  type: string
                  format: date-time
                  description: The start time of the fast.
                target_end_time:
                  type: string
                  format: date-time
                  description: The target end time of the fast.
                fasting_type:
                  type: string
                  description: The type of fast (e.g., "Intermittent Fasting").
      responses:
        '201':
          description: Success starting fast.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FastingLog'
        '400':
          description: Validation error or active fast already exists.
        '401':
          description: Unauthorized.
        '500':
          description: Internal server error.
      operationId: postFastingStart
      x-operation-id-source: derived
  /fasting/end:
    post:
      summary: End an active fast
      tags:
      - Wellness & Metrics
      description: Ends an active fasting period, calculates duration, and optionally logs mood.
      security:
      - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - end_time
              properties:
                id:
                  type: string
                  format: uuid
                  description: The ID of the fast to end.
                start_time:
                  type: string
                  format: date-time
                  description: Optional start time to override.
                end_time:
                  type: string
                  format: date-time
                  description: The end time of the fast.
                mood:
                  type: object
                  properties:
                    value:
                      type: integer
                    notes:
                      type: string
      responses:
        '200':
          description: Success ending fast.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FastingLog'
        '400':
          description: Validation error.
        '401':
          description: Unauthorized.
        '404':
          description: Fast not found.
        '500':
          description: Internal server error.
      operationId: postFastingEnd
      x-operation-id-source: derived
  /fasting/{id}:
    put:
      summary: Update an existing fast
      tags:
      - Wellness & Metrics
      description: Updates the details of an existing fasting log.
      security:
      - apiKeyAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
        description: The ID of the fast to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FastingLog'
      responses:
        '200':
          description: Success updating fast.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FastingLog'
        '401':
          description: Unauthorized.
        '404':
          description: Fast not found.
        '500':
          description: Internal server error.
      operationId: putFastingById
      x-operation-id-source: derived
    delete:
      summary: Delete a fasting log
      tags:
      - Wellness & Metrics
      description: Deletes an existing fasting log.
      security:
      - apiKeyAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
        description: The ID of the fast to delete.
      responses:
        '200':
          description: Success deleting fast.
        '401':
          description: Unauthorized.
        '404':
          description: Fast not found.
        '500':
          description: Internal server error.
      operationId: deleteFastingById
      x-operation-id-source: derived
  /fasting/history:
    get:
      summary: Get fasting history
      tags:
      - Wellness & Metrics
      description: Retrieves a paginated history of fasting logs for the authenticated user.
      security:
      - apiKeyAuth: []
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          default: 50
        description: Maximum number of records to return.
      - in: query
        name: offset
        schema:
          type: integer
          default: 0
        description: Number of records to skip.
      responses:
        '200':
          description: A list of fasting logs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FastingLog'
        '401':
          description: Unauthorized.
        '500':
          description: Internal server error.
      operationId: getFastingHistory
      x-operation-id-source: derived
  /fasting/stats:
    get:
      summary: Get fasting statistics
      tags:
      - Wellness & Metrics
      description: Retrieves summary statistics for the user's fasting history.
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: Fasting statistics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_completed_fasts:
                    type: integer
                  total_minutes_fasted:
                    type: integer
                  average_duration_minutes:
                    type: number
        '401':
          description: Unauthorized.
        '500':
          description: Internal server error.
      operationId: getFastingStats
      x-operation-id-source: derived
  /fasting/history/range/{startDate}/{endDate}:
    get:
      summary: Get fasting logs by date range
      tags:
      - Wellness & Metrics
      description: Retrieves completed fasting logs within a specified date range.
      security:
      - apiKeyAuth: []
      parameters:
      - in: path
        name: startDate
        required: true
        schema:
          type: string
          format: date
        description: Start date (YYYY-MM-DD).
      - in: path
        name: endDate
        required: true
        schema:
          type: string
          format: date
        description: End date (YYYY-MM-DD).
      responses:
        '200':
          description: A list of fasting logs within the range.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FastingLog'
        '401':
          description: Unauthorized.
        '500':
          description: Internal server error.
      operationId: getFastingHistoryRangeByStartDateByEndDate
      x-operation-id-source: derived
  /measurements/health-data:
    post:
      summary: Submit health data via API Key
      tags:
      - Wellness & Metrics
      description: Receives health data (e.g., from a mobile app) via an authorized API key.
      security:
      - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                description: Flexible health data object.
      responses:
        '200':
          description: 'Request processed. Per-record outcomes are reported in the body: `processed` lists successful records, `errors` lists rejected records with their reasons, and `skipped` lists records that were intentionally not written (e.g. Nutrition records without a source_id). `errors` and `skipped` are always present, possibly empty. A 200 response with a non-empty `errors` array means the remaining records were still saved.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  processed:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                        status:
                          type: string
                          enum:
                          - success
                        data:
                          type: object
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        error:
                          type: string
                        entry:
                          type: object
                  skipped:
                    type: array
                    items:
                      type: object
                      properties:
                        reason:
                          type: string
                        entry:
                          type: object
        '400':
          description: Malformed request body (invalid JSON, or entries that are not non-null objects).
        '401':
          description: Unauthorized (missing or invalid API key).
        '403':
          description: Forbidden (API key lacks write permission).
      operationId: postMeasurementsHealthData
      x-operation-id-source: derived
  /measurements/import-health-data:
    post:
      summary: Import health data from a CSV (session authenticated)
      tags:
      - Wellness & Metrics
      description: Bulk-imports client-parsed health data rows (body measurements, sleep, vitals, daily activity totals, hydration) through the same processHealthData pipeline used by mobile sync. Rows without a `source` default to `CSV_Import` so re-imports dedup on the same natural keys.
      security:
      - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - items
              properties:
                items:
                  type: array
                  items:
                    type: object
                    description: Flat health data object (type + value/date + optional unit/source).
      responses:
        '200':
          description: 'Request processed. Per-record outcomes are reported in the body: `processed`, `errors`, and `skipped`. A 200 with a non-empty `errors` array means the remaining rows were still saved.

            '
        '400':
          description: Malformed request body (fails schema validation).
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden (lacks checkin permission).
      operationId: postMeasurementsImportHealthData
      x-operation-id-source: derived
  /measurements/water-intake/{date}:
    get:
      summary: Get water intake for a date
      tags:
      - Wellness & Metrics
      security:
      - apiKeyAuth: []
      parameters:
      - in: path
        name: date
        required: true
        schema:
          type: string
          format: date
        description: Date in YYYY-MM-DD format.
      - in: query
        name: userId
        schema:
          type: string
          format: uuid
        description: Optional user ID to fetch water intake for (requires diary permission).
      responses:
        '200':
          description: Aggregated water intake for the date.
          content:
            application/json:
              schema:
                type: object
                properties:
                  water_ml:
                    type: number
                    description: Total water consumed in milliliters.
        '400':
          description: Invalid date format.
        '403':
          description: Forbidden.
      operationId: getMeasurementsWaterIntakeByDate
      x-operation-id-source: derived
  /measurements/water-intake:
    post:
      summary: Upsert water intake
      tags:
      - Wellness & Metrics
      security:
      - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entry_date:
                  type: string
                  format: date
                  description: Date in YYYY-MM-DD format.
                change_drinks:
                  type: number
                  description: Number of drinks to add (positive) or remove (negative).
                container_id:
                  type:
                  - number
                  - 'null'
                  description: The water container ID used for volume calculation.
                user_id:
                  type: string
                  format: uuid
                  description: Optional target user ID (requires checkin permission).
              required:
              - entry_date
              - change_drinks
              - container_id
      responses:
        '200':
          description: Water intake upserted successfully.
        '400':
          description: Validation error.
        '403':
          description: Forbidden.
      operationId: postMeasurementsWaterIntake
      x-operation-id-source: derived
  /measurements/water-intake/entry/{id}:
    get:
      summary: Get a specific water intake entry by ID
      tags:
      - Wellness & Metrics
      security:
      - apiKeyAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The water intake entry.
      operationId: getMeasurementsWaterIntakeEntryById
      x-operation-id-source: derived
  /measurements/water-intake/{id}:
    put:
      summary: Update a water intake entry
      tags:
      - Wellness & Metrics
      security:
      - apiKeyAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                water_ml:
                  type: number
                  description: Water amount in milliliters.
                entry_date:
                  type: string
                  format: date
                  description: Date in YYYY-MM-DD format.
                source:
                  type: string
                  description: Source of the water intake entry (e.g. manual, healthkit).
      responses:
        '200':
          description: Water intake entry updated successfully.
        '400':
          description: Validation error.
        '403':
          description: Forbidden.
        '404':
          description: Water intake entry not found.
      operationId: putMeasurementsWaterIntakeById
      x-operation-id-source: derived
    delete:
      summary: Delete a water intake entry
      tags:
      - Wellness & Metrics
      security:
      - apiKeyAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Water intake entry deleted successfully.
      operationId: deleteMeasurementsWaterIntakeById
      x-operation-id-source: derived
  /measurements/check-in:
    post:
      summary: Upsert check-in measurements
      tags:
      - Wellness & Metrics
      security:
      - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entry_date:
                  type: string
                  format: date
                  description: Date in YYYY-MM-DD format.
                weight:
                  type:
                  - number
                  - 'null'
                neck:
                  type:
                  - number
                  - 'null'
                waist:
                  type:
                  - number
                  - 'null'
                hips:
                  type:
                  - number
                  - 'null'
                steps:
                  type:
                  - number
                  - 'null'
                height:
                  type:
                  - number
                  - 'null'
                body_fat_percentage:
                  type:
                  - number
                  - 'null'
              required:
              - entry_date
      responses:
        '200':
          description: Check-in measurements upserted successfully.
        '400':
          description: Validation error.
      operationId: postMeasurementsCheckIn
      x-operation-id-source: derived
  /measurements/check-in/latest-on-or-before-date:
    get:
      summary: Get latest check-in measurements on or before a date
      tags:
      - Wellness & Metrics
      security:
      - apiKeyAuth: []
      parameters:
      - in: query
        name: date
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: The latest check-in measurements.
      operationId: getMeasurementsCheckInLatestOnOrBeforeDate
      x-operation-id-source: derived
  /measurements/check-in/{date}:
    get:
      summary: Get check-in measurements for a specific date
      tags:
      - Wellness & Metrics
      security:
      - apiKeyAuth: []
      parameters:
      - in: path
        name: date
        required: true
        schema:
          type: string
          format: date
        description: Date in YYYY-MM-DD format.
      - in: query
        name: userId
        schema:
          type: string
          format: uuid
        description: Optional user ID to fetch measurements for (requires checkin permission).
      responses:
        '200':
          description: Check-in measurements for the date.
        '400':
          description: Invalid date format.
        '403':
          description: Forbidden.
      operationId: getMeasurementsCheckInByDate
      x-operation-id-source: derived
  /measurements/check-in/{id}:
    put:
      summary: Update a check-in measurement entry
      tags:
      - Wellness & Metrics
      security:
      - apiKeyAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entry_date:
                  type: string
                  format: date
                  description: Date in YYYY-MM-DD format.
                weight:
                  type: number
                neck:
                  type: number
                waist:
                  type: number
                hips:
                  type: number
                steps:
                  type: number
                height:
                  type: number
                body_fat_percentage:
                  type: number
              required:
              - entry_date
      responses:
        '200':
          description: Measurement updated successfully.
        '400':
          description: Validation error or missing entry_date.
        '404':
          description: Check-in measurement not found.
      operationId: putMeasurementsCheckInById
      x-operation-id-source: derived
    delete:
      summary: Delete a check-in measurement entry
      tags:
      - Wellness & Metrics
      security:
      - apiKeyAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Measurement deleted successfully.
      operationId: deleteMeasurementsCheckInById
      x-operation-id-source: derived
  /measurements/custom-categories:
    get:
      summary: Get all custom measurement categories
      tags:
      - Wellness & Metrics
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: A list of custom measurement categories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomMeasurementCategory'
      operationId: getMeasurementsCustomCategories
      x-operation-id-source: derived
    post:
      summary: Create a new custom measurement category
      tags:
      - Wellness & Metrics
      security:
      - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                display_name:
                  type:
                  - string
                  - 'null'
                frequency:
                  type: string
                  description: Tracking frequency (e.g. daily, hourly).
                measurement_type:
                  type: string
                data_type:
                  type:
                  - string
                  - 'null'
                  description: Data type (e.g. numeric, boolean, text).
              required:
              - name
              - frequency
              - measurement_type
      responses:
        '201':
          description: Custom category created successfully.
        '400':
          description: Validation error.
      operationId: postMeasurementsCustomCategories
      x-operation-id-source: derived
  /measurements/custom-entries:
    post:
      summary: Upsert a custom measurement entry
      tags:
      - Wellness & Metrics
      security:
      - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category_id:
                  type: string
                  format: uuid
                value:
                  oneOf:
                  - type: number
                  - type: string
                  description: Measurement value (type depends on category data_type).
                entry_date:
                  type: string
                  format: date
                  description: Date in YYYY-MM-DD format.
                entry_hour:
                  type:
                  - integer
                  - 'null'
                  description: Hour of day (0-23) for hourly measurements.
                entry_timestamp:
                  type: string
                  format: date-time
                  description: Full timestamp for the entry.
                notes:
                  type: string
                source:
                  type: string
                  description: Source of the entry (e.g. manual, healthkit).
              required:
              - category_id
              - value
              - entry_date
      responses:
        '201':
          description: Custom entry upserted successfully.
        '400':
          description: Validation error.
      operationId: postMeasurementsCustomEntries
      x-operation-id-source: derived
    get:
      summary: Get custom measurement entries with filtering
      tags:
      - Wellness & Metrics
      security:
      - apiKeyAuth: []
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
      - in: query
        name: orderBy
        schema:
          type: string
      - in: query
        name: category_id
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: List of custom measurement entries.
      operationId: getMeasurementsCustomEntries
      x-operation-id-source: derived
  /measurements/custom-entries/{id}:
    delete:
      summary: Delete a custom measurement entry
      tags:
      - Wellness & Metrics
      security:
      - apiKeyAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Entry deleted successfully.
      operationId: deleteMeasurementsCustomEntriesById
      x-operation-id-source: derived
  /measurements/custom-categories/{id}:
    put:
      summary: Update a custom measurement category
      tags:
      - Wellness & Metrics
      security:
      - apiKeyAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
