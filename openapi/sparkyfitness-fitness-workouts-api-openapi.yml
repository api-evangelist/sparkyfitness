                - integer
                - 'null'
              sets:
                type: array
                items:
                  $ref: '#/components/schemas/WorkoutSet'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - user_id
      - name
