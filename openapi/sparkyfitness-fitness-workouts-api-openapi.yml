          type: string
          description: e.g., "Normal", "Warmup", "Dropset"
        reps:
          type:
          - integer
          - 'null'
        weight:
          type:
          - number
          - 'null'
        duration:
          type:
          - integer
          - 'null'
          description: Duration in seconds
        distance:
          type:
          - number
          - 'null'
