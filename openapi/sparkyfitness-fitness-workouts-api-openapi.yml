        rest_time:
          type:
          - integer
          - 'null'
          description: Rest time in seconds
        notes:
          type:
          - string
          - 'null'
      required:
      - set_number
      - set_type
    WorkoutPreset:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        is_public:
          type: boolean
        exercises:
          type: array
          items:
            type: object
            properties:
              id:
