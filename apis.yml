apis:
- name: SparkyFitness MCP Server
  description: >-
    A first-party Model Context Protocol server running in-process inside the SparkyFitness API server,
    mounted at POST /mcp over a stateless streamable HTTP transport. 56 tools across food, exercise, check-ins,
    goals, coaching, vision, profile, reports and medications, authenticated with a Bearer API key and
    scoped to that key's user by row level security. Five admin-only developer tools bypass RLS and are
    off unless DEV_TOOLS_ENABLED=true.
  humanURL: https://codewithcj.github.io/SparkyFitness/features/mcp-server
  baseURL: https://{host}/mcp
  tags:
  - MCP
  - AI Assistant
  - Agents
