aid: sparkyfitness
name: SparkyFitness
description: >-
  SparkyFitness is a self-hosted, open-source health and fitness tracker for
  food, exercise, water, sleep, mood, body measurements and medications, built
  for families and designed around an AI assistant. It ships a full Express 5 +
  PostgreSQL REST API (423 operations across 328 paths, described by an
  OpenAPI 3.0 document the server generates and serves at /api/api-docs/json)
  and — unusually for a project this size — a first-party Model Context Protocol
  server running in-process at POST /mcp, exposing 56 tools for logging and
  reading a user's own health data under PostgreSQL row-level security. It
  synchronises with Garmin, Fitbit, Withings, Strava, Polar, Oura, Hevy, Apple
  HealthKit and Google Health Connect, and looks food up against OpenFoodFacts,
  USDA, FatSecret and Nutritionix. Because it is self-hosted, there is no vendor
  API host, no pricing and no signup: you run the containers and the API is
  yours. Distributed under a source-available non-commercial licence.
