apis:
- name: SparkyFitness API
  description: >-
    The REST API served by the SparkyFitness server on your own deployment.
    423 operations across nine functional areas — nutrition and meals, fitness
    and workouts, wellness and metrics, goals and personalization, medications
    and GLP-1, external integrations, identity and security, AI and insights,
    and system administration. API-key authenticated, scoped by PostgreSQL row
    level security to the key's user.
  humanURL: https://codewithcj.github.io/SparkyFitness/developer/api-reference
  baseURL: https://{host}/api
